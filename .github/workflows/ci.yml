name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:immutable-migration-history -- "$MIGRATION_HISTORY_BASE_REF"
        env:
          MIGRATION_HISTORY_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - run: npm run check:immutable-catalog-history -- "$CATALOG_HISTORY_BASE_REF"
        env:
          CATALOG_HISTORY_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - run: npm run check:immutable-imagegen-history -- "$IMAGEGEN_HISTORY_BASE_REF"
        env:
          IMAGEGEN_HISTORY_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - run: npm run check:immutable-economy-history -- "$ECONOMY_HISTORY_BASE_REF"
        env:
          ECONOMY_HISTORY_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - run: npm run check:collectible-catalog
      - run: npm run test:imagegen-uv
      - run: npm run test:runtime-dice-assets
      - run: npm run check:runtime-dice-assets
      - run: npm run check:economy-disclosures
      - run: npm run check:economy-simulations
      - run: npm run check:production-economy
      - run: npm run test:db:supabase
      - run: npm run lint
      - run: npm test -- --run
      # Order-independence gate (issue #224). A second run at one *pinned*
      # permutation: shuffling breaks the declaration order that hides leaked
      # cross-test state, and pinning the seed keeps CI deterministic — a random
      # seed per run would be flaky-by-design. Bump the seed deliberately (in its
      # own PR) to sweep a new permutation; never to make a red run go away.
      - run: npm test -- --run --sequence.shuffle --sequence.seed=20260802
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --locked
